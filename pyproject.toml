[project]
name = "datadocs"
version = "0.1.1"
description = "Generate documents from structured data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andres Velasco Garcia" }]
keywords = ["documents", "jinja", "markdown", "templates", "reports"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/AndresVelasco/datadocs"
Repository = "https://github.com/AndresVelasco/datadocs"
Issues = "https://github.com/AndresVelasco/datadocs/issues"

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.0"]
http = ["httpx>=0.27"]
dev = [
    "packaging>=25,<27",
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "twine>=6.0",
]

[project.scripts]
datadocs = "datadocs.cli:app"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
files = ["datadocs"]
